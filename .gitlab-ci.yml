# APEX CI/CD — gitlab.sixdee/devops/apex-scanner
#
# Design constraints (verified against this GitLab instance, 15.3.1):
#   * Runners here are shell/host-docker executors — the house pattern (see
#     devops/base-image-builder) uses raw `docker build`/`docker push` and never
#     sets `image:`. So every job runs commands through `docker run` instead of
#     relying on a job container.
#   * No external image pulls are required by validate/build/test: tests execute
#     inside the API image we just built (it already carries all Python deps),
#     and the self-scan uses the Trivy binary inside our own worker image.
#   * Publishing is manual and only runs when REGISTRY_URL is configured, so the
#     pipeline is useful immediately even before registry creds are wired.
#
# Closes review findings: "zero CI/CD", "no test gate", "no secret scanning",
# "no image scanning (ironic for a vuln scanner)", "no immutable artifacts /
# no rollback target".

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - when: always

stages:
  - validate
  - build
  - test
  - scan
  - publish
  - deploy

variables:
  # Immutable, traceable tag for every artifact this pipeline produces.
  TAG: "$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
  IMG_API: "apex-api"
  IMG_WORKER: "apex-worker"
  IMG_DASHBOARD: "apex-dashboard"
  GIT_DEPTH: "0"          # secret scan needs real history, not a 1-commit clone

default:
  # Dedicated, project-locked runner on the APEX host (10.0.2.121), registered in
  # the shared gitlab-runner container's config.toml alongside the other house
  # runners (runner id 116, tag apex-local, run_untagged=false). Docker executor
  # against the HOST docker socket, with the real deploy dir bind-mounted at its
  # true path — so builds and the deploy job both act on this server.
  tags:
    - apex-local

# ------------------------------------------------------------------
# validate — fail fast, no dependencies at all
# ------------------------------------------------------------------
secret-scan:
  stage: validate
  script:
    - chmod +x app/scripts/ci-secret-scan.sh
    - ./app/scripts/ci-secret-scan.sh

compose-lint:
  stage: validate
  # The compose file declares required vars with `${VAR:?...}`, so `config`
  # refuses to interpolate without them. These placeholders exist only to
  # validate file STRUCTURE in CI — nothing is started, and real values always
  # come from the gitignored app/.env at deploy time.
  # Full set of `${VAR:?...}` required vars across docker-compose.yml and
  # docker-compose.edge.yml (kept in sync via:
  #   grep -ohE '\$\{[A-Z_]+:\?[^}]*\}' app/docker-compose*.yml | sed -E 's/.*\{([A-Z_]+):\?.*/\1/' | sort -u )
  variables:
    ADMIN_PASSWORD_HASH: "ci-lint-placeholder"
    ADMIN_USERNAME: "ci-lint"
    FLOWER_PASSWORD: "ci-lint-placeholder"
    FLOWER_USER: "ci-lint"
    JWT_SECRET_KEY: "ci-lint-placeholder"
    POSTGRES_PASSWORD: "ci-lint-placeholder"
    REDIS_PASSWORD: "ci-lint-placeholder"
    SERVER_HOST: "http://ci-lint.invalid"
  script:
    - |
      if docker compose version >/dev/null 2>&1; then
        docker compose -f app/docker-compose.yml config -q
        docker compose -f app/docker-compose.yml -f app/docker-compose.edge.yml config -q
      else
        docker-compose -f app/docker-compose.yml config -q
        docker-compose -f app/docker-compose.yml -f app/docker-compose.edge.yml config -q
      fi
    - echo "compose config valid (base + edge overlay)"

# ------------------------------------------------------------------
# build — immutable, SHA-tagged images (the rollback targets)
# ------------------------------------------------------------------
build-api:
  stage: build
  script:
    - docker build --pull -f app/Dockerfile.api -t $IMG_API:$TAG app
    # Prove secrets are NOT baked into the layer (the .dockerignore contract).
    - |
      if docker run --rm --entrypoint sh $IMG_API:$TAG -c 'test -f /app/.env'; then
        echo "FATAL: app/.env is present inside the image — .dockerignore is not doing its job"; exit 1
      fi
      echo "verified: no .env inside image"

build-worker:
  stage: build
  script:
    - docker build --pull -f app/Dockerfile.worker -t $IMG_WORKER:$TAG app
    - |
      if docker run --rm --entrypoint sh $IMG_WORKER:$TAG -c 'test -f /app/.env'; then
        echo "FATAL: app/.env is present inside the image"; exit 1
      fi
    # Scanner binaries must be present and executable in the shipped image.
    - docker run --rm --entrypoint sh $IMG_WORKER:$TAG -c 'grype version && trivy --version && syft version'

build-dashboard:
  stage: build
  script:
    - docker build --pull -f dashboard/Dockerfile -t $IMG_DASHBOARD:$TAG dashboard

# ------------------------------------------------------------------
# test — run the suite inside the built API image (deps already installed)
# ------------------------------------------------------------------
pytest:
  stage: test
  needs: ["build-api"]
  script:
    # tests/ is excluded from the image by .dockerignore, so mount the source
    # tree and run against the image's pre-installed venv.
    - mkdir -p .ci && chmod 777 .ci
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR/app:/src:ro" \
        -v "$CI_PROJECT_DIR/.ci:/out" \
        -w /src --entrypoint sh $IMG_API:$TAG -c \
        'python -m pytest tests -q -p no:cacheprovider --junitxml=/out/junit.xml'
  artifacts:
    when: always
    reports:
      junit: .ci/junit.xml
    expire_in: 1 week
  allow_failure: false

# ------------------------------------------------------------------
# scan — APEX scans APEX (dogfooding; uses Trivy inside our worker image)
# ------------------------------------------------------------------
.self-scan: &self_scan
  stage: scan
  allow_failure: true      # non-blocking until the Trivy DB mirror is confirmed on runners
  script:
    - mkdir -p .scan
    - docker save $TARGET_IMAGE:$TAG -o .scan/image.tar
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR/.scan:/scan" \
        --entrypoint trivy $IMG_WORKER:$TAG \
        image --input /scan/image.tar \
        --severity HIGH,CRITICAL --no-progress \
        --format table
    - rm -f .scan/image.tar

self-scan-api:
  <<: *self_scan
  needs: ["build-api", "build-worker"]
  variables:
    TARGET_IMAGE: "apex-api"

self-scan-worker:
  <<: *self_scan
  needs: ["build-worker"]
  variables:
    TARGET_IMAGE: "apex-worker"

self-scan-dashboard:
  <<: *self_scan
  needs: ["build-dashboard", "build-worker"]
  variables:
    TARGET_IMAGE: "apex-dashboard"

# ------------------------------------------------------------------
# publish — push immutable artifacts to Harbor (project: apex)
#
# Auth uses a Harbor ROBOT account scoped to push/pull on the apex project only
# (never the admin account). Its username literally begins with "robot$"; that
# "$" is written in-script instead of stored in a CI variable, because GitLab
# expands "$apex" inside variable values. Only the suffix lives in
# REGISTRY_ROBOT, and the secret is a masked CI variable.
# Harbor has auto_scan enabled on the project, so every pushed tag is also
# scanned by Harbor's own Trivy — independent of our in-pipeline self-scan.
# ------------------------------------------------------------------
publish:
  stage: publish
  needs: ["pytest", "build-worker", "build-dashboard"]
  rules:
    - if: $REGISTRY_URL == null || $REGISTRY_URL == ""
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u 'robot$'"$REGISTRY_ROBOT" --password-stdin
    - |
      REG="$REGISTRY_URL/$REGISTRY_PROJECT"
      for pair in "$IMG_API=api" "$IMG_WORKER=worker" "$IMG_DASHBOARD=dashboard"; do
        img_name="${pair%%=*}"; remote_path="${pair##*=}"
        remote="$REG/$remote_path"
        docker tag "$img_name:$TAG" "$remote:$TAG"
        docker tag "$img_name:$TAG" "$remote:latest"
        docker push "$remote:$TAG"
        docker push "$remote:latest"
        echo "pushed $remote:$TAG"
      done
    - docker logout "$REGISTRY_URL" || true
    - 'echo "Published. Rollback target for this commit -> $TAG"'

# ------------------------------------------------------------------
# deploy — roll out the exact published artifacts onto THIS server
#
# Runs on the apex-local runner, which bind-mounts /opt/new-grype-scanner-v1 at
# its real host path. That matters: compose bind-mounts are resolved by the host
# daemon, and the runtime secrets (app/.env, gitignored) exist only there. We
# pull the published images and retag them to the names compose expects, then
# bring the stack up with --no-build — so what runs is exactly what was
# published and scanned. No rebuild, no drift.
# ------------------------------------------------------------------
deploy:
  stage: deploy
  needs: ["publish"]
  environment:
    name: production
    url: https://apexscanner.6dcorp.internal
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  variables:
    DEPLOY_DIR: /opt/new-grype-scanner-v1
  script:
    # NB: quote any script line containing ": " — bare YAML scalars with a colon
    # are parsed as a mapping and rejected by the CI schema.
    - 'test -d "$DEPLOY_DIR/app" || { echo "FATAL: $DEPLOY_DIR is not mounted into the runner"; exit 1; }'
    - 'test -f "$DEPLOY_DIR/app/.env" || { echo "FATAL: app/.env missing on host (runtime secrets live only there)"; exit 1; }'
    # Never deploy over uncommitted tracked changes on the host checkout.
    - |
      dirty=$(git -C "$DEPLOY_DIR" status --porcelain --untracked-files=no)
      if [ -n "$dirty" ]; then
        echo "FATAL: $DEPLOY_DIR has uncommitted tracked changes — refusing to deploy:"; echo "$dirty"; exit 1
      fi
    # Fast-forward the host checkout to exactly this commit (never a hard reset).
    # Fetch from the job's own clone rather than the remote: both paths are
    # visible inside the job container, so this needs no git credentials.
    - git -C "$DEPLOY_DIR" fetch "$CI_PROJECT_DIR" "$CI_COMMIT_SHA"
    - git -C "$DEPLOY_DIR" merge --ff-only FETCH_HEAD
    - git -C "$DEPLOY_DIR" log --oneline -1
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u 'robot$'"$REGISTRY_ROBOT" --password-stdin
    - |
      REG="$REGISTRY_URL/$REGISTRY_PROJECT"
      docker pull "$REG/api:$TAG"
      docker pull "$REG/worker:$TAG"
      docker pull "$REG/dashboard:$TAG"
      # Retag to the image names compose would otherwise build.
      docker tag "$REG/api:$TAG"       app-api:latest
      docker tag "$REG/worker:$TAG"    app-worker-high:latest
      docker tag "$REG/worker:$TAG"    app-worker-batch:latest
      docker tag "$REG/worker:$TAG"    app-worker-system:latest
      docker tag "$REG/dashboard:$TAG" app-dashboard:latest
    - docker logout "$REGISTRY_URL" || true
    - |
      cd "$DEPLOY_DIR/app"
      COMPOSE="docker compose"
      docker compose version >/dev/null 2>&1 || COMPOSE="docker-compose"
      $COMPOSE -f docker-compose.yml -f docker-compose.edge.yml up -d --no-build
    # Schema migrations are idempotent; run after the new image is live.
    - docker exec -w /app fastapi_scanner alembic upgrade head
    # The edge caches upstream container IPs at startup, so recreated containers
    # 502 until nginx is reloaded (seen repeatedly during manual deploys).
    - docker exec apexscanner_edge nginx -s reload
    - |
      code=000
      for i in $(seq 1 12); do
        code=$(docker exec fastapi_scanner python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health',timeout=5).status)" 2>/dev/null || echo 000)
        echo "health attempt $i -> $code"
        [ "$code" = "200" ] && break
        sleep 5
      done
      [ "$code" = "200" ] || { echo "FATAL: API unhealthy after deploy"; exit 1; }
    - 'echo "Deployed $TAG on 10.0.2.121. Rollback -> re-run deploy on the previous good pipeline."'
